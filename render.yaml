services:
  - type: web
    name: farmdirect-marketplace
    runtime: python
    buildCommand: bash build.sh
    startCommand: cd backend && python seed.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
